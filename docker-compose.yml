# hawk-mod — youth-protection DM monitoring for the RHR Slack workspace.
#
# Follows the homelab convention: the app publishes NO ports. It joins the
# shared external `edge` network and Caddy reverse-proxies to it by container
# name, terminating TLS. See docs/deploy-linode.md for the Caddyfile block.
#
# UNLIKE the tremblay.house stacks, this one must be reachable from the PUBLIC
# internet — Slack delivers events and the OAuth redirect from its own servers,
# over HTTPS, to PUBLIC_URL. A tailnet-only hostname will not work.
services:
  hawk-mod:
    build: .
    # Or pull the image built by .github/workflows/docker.yml:
    # image: ghcr.io/frc2713/hawk-mod:latest
    container_name: hawk-mod
    restart: unless-stopped
    environment:
      # --- Slack app credentials (required) --------------------------------
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:?set SLACK_SIGNING_SECRET in .env}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:?set SLACK_CLIENT_ID in .env}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:?set SLACK_CLIENT_SECRET in .env}
      SLACK_STATE_SECRET: ${SLACK_STATE_SECRET:?generate with `openssl rand -hex 32`}

      # --- Deployment ------------------------------------------------------
      # Public HTTPS base URL. Must match the app manifest's request and
      # redirect URLs exactly, or Slack will not deliver events.
      PUBLIC_URL: ${PUBLIC_URL:?e.g. https://hawk-mod.example.org}
      PORT: 3000

      # Private channel that receives findings. Screened adults only.
      ALERT_CHANNEL_ID: ${ALERT_CHANNEL_ID:?channel ID, not name}

      # --- Storage ---------------------------------------------------------
      DATA_DIR: /data
      # Encrypts adult user tokens at rest: openssl rand -base64 32.
      # Losing this means every adult has to re-authorize; leaking it means
      # the volume alone can read their DMs.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?generate with `openssl rand -base64 32`}
      # full = store message text of monitored DMs; metadata = who/when only.
      LOG_MODE: ${LOG_MODE:-full}

      # --- Roles --------------------------------------------------------
      # Slack user groups that declare who is a student and who is an adult.
      # Unset means the roster is maintained by CSV import instead. Anything
      # config.ts reads has to be listed here: compose forwards only what it
      # is told to, and a missing one silently reads as "feature off".
      STUDENT_USERGROUP: ${STUDENT_USERGROUP:-}
      ADULT_USERGROUP: ${ADULT_USERGROUP:-}

      # --- Schedules -------------------------------------------------------
      TZ: ${TZ:-America/New_York}
      SWEEP_CRON: ${SWEEP_CRON:-0 3 * * *}
      BACKFILL_CRON: ${BACKFILL_CRON:-15 * * * *}
      DIGEST_CRON: ${DIGEST_CRON:-0 8 * * *}
      QUARTERLY_CRON: ${QUARTERLY_CRON:-0 9 1 1,4,7,10 *}
    volumes:
      # Minors' message content lives here. Back it up; see the data-handling
      # note in docs/deploy-linode.md before pointing this at a host path.
      - hawk-mod-data:/data
    networks:
      - edge
    # Uncomment ONLY for a standalone run with no Caddy in front. Slack still
    # needs HTTPS, so this is for local testing, not for the Linode host.
    # ports:
    #   - "${PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  edge:
    # Owned by the Caddy stack; this app only joins it.
    external: true
    name: edge

volumes:
  hawk-mod-data:
