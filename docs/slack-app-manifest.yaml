# Paste at https://api.slack.com/apps -> Create New App -> From an app manifest.
# Replace hawk-mod.example.org with PUBLIC_URL everywhere it appears.
#
# The icon is not part of a manifest and has to be uploaded by hand, once:
# Basic Information -> Display Information -> App icon, with
# assets/hawk-mod-icon-512.png. Slack keeps it across later manifest edits.
display_information:
  name: Hawk Mod
  description: Youth-protection monitoring for Red Hawk Robotics
  long_description: >-
    Hawk Mod records direct messages that include a student so the team can
    audit them, because Slack cannot block adult-student DMs below Enterprise
    Grid. Adults authorize it individually. Conversations with no student in
    them are not recorded.
  background_color: "#ba0c2f"

features:
  bot_user:
    display_name: Hawk Mod
    always_online: true
  slash_commands:
    - command: /hawkmod
      url: https://hawk-mod.example.org/slack/events
      description: Coverage, findings, and audits
      usage_hint: status | findings | whois @user | resolve <id> <note>
      should_escape: true

oauth_config:
  redirect_urls:
    - https://hawk-mod.example.org/slack/oauth_redirect
  scopes:
    bot:
      - chat:write
      # Opens Hawk Mod's own DM with an adult, to send guidance when their
      # conversation raises a finding. Never used to write into the
      # conversation itself, which an app cannot join in any case.
      - im:write
      - commands
      - channels:read
      - groups:read
      - team:read
      - users:read
      - users:read.email
      - usergroups:read
    # Granted per adult, by that adult. This is the only way to see DMs
    # without Enterprise Grid.
    user:
      - im:read
      - im:history
      - mpim:read
      - mpim:history
      - users:read

settings:
  interactivity:
    is_enabled: true
    request_url: https://hawk-mod.example.org/slack/events
  event_subscriptions:
    request_url: https://hawk-mod.example.org/slack/events
    bot_events:
      - member_joined_channel
      - member_left_channel
      - team_join
      - tokens_revoked
      # Roles come from user groups, so a membership edit is a roster edit.
      - subteam_created
      - subteam_members_changed
      - subteam_updated
    user_events:
      - message.im
      - message.mpim
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
