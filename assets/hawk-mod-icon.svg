<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Hawk Mod app icon: the Red Hawk Robotics wing-and-R (rhr-r-logo.svg,
    paths unmodified) with a padlock in front of it.

    After editing this file, re-render the PNG that Slack wants with `sips`,
    passing this file in and hawk-mod-icon-512.png out. (Spelling the flags out
    here is not possible: a double hyphen is illegal inside an XML comment, and
    it is what just broke this file once.)

    The lock sits left of the R on purpose — centered, it cuts the letter in
    half. The red strokes under the lock are a knockout: they hold a gap
    between the lock and the wing so both still read where they overlap.

    Slack masks app icons to a rounded square, so the field bleeds to the edge
    and nothing important comes within ~24px of it.
  -->
  <rect width="512" height="512" fill="#ba0c2f"/>

  <g transform="translate(26 122) scale(0.4425)" fill="#F7F2EA">
    <path d="M0,.02c126.56,108.48,334.91,99.9,495.88,99.9h540.53l3.92-22.22c.75-4.38,1.13-8.81,1.12-13.26.36-17.17-5.84-33.18-18.11-45.2C1011.08,6.87,991.89-.44,974.48.02H0Z"/>
    <path d="M245.42,125.2c90.87,77.91,193.93,77.91,324.29,78.24h81.73l14.37-78.24H245.42Z"/>
    <path d="M450.8,231.89c85,59.87,148.97,83.71,177.98,93.07l17.09-91.26-195.07-1.81Z"/>
    <path d="M660.77,331.42h108.57l22.59-126.23h115.98l-21.85,126.23h108.57l21.66-126.23v-5.6c-1.12-12.35-6.31-23.97-14.75-33.05,13.45-9.34,25.13-25.56,29.82-41.25h-332.74l-37.85,206.13h0Z"/>
  </g>

  <g>
    <path d="M 134 292 V 270 C 134 248, 151 232, 172 232 C 193 232, 210 248, 210 270 V 292"
          fill="none" stroke="#ba0c2f" stroke-width="70"/>
    <rect x="108" y="292" width="128" height="104" rx="18"
          fill="none" stroke="#ba0c2f" stroke-width="28" stroke-linejoin="round"/>
    <path d="M 134 292 V 270 C 134 248, 151 232, 172 232 C 193 232, 210 248, 210 270 V 292"
          fill="none" stroke="#F7F2EA" stroke-width="24"/>
    <rect x="108" y="292" width="128" height="104" rx="18" fill="#F7F2EA"/>
    <circle cx="172" cy="332" r="14" fill="#ba0c2f"/>
    <path d="M 166 342 h 12 l 4 28 h -20 Z" fill="#ba0c2f"/>
  </g>
</svg>
